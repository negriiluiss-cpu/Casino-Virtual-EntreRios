<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Casino Virtual EntreRios</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h1>🎰 Casino Virtual EntreRios</h1>

  <div id="login">
    <h2>Login</h2>

    <form id="loginForm">
      <input id="username" placeholder="Usuario" required />
      <input id="password" type="password" placeholder="Contraseña" required />
      <button type="submit">Entrar</button>
    </form>

    <p id="loginMsg"></p>
  </div>

  <div id="game" style="display:none;">
    <h2>Tragamonedas</h2>

    <p>Fichas: <strong><span id="chips">0</span></strong></p>

    <select id="theme"></select><br/>

    <input id="bet" type="number" placeholder="Apuesta" />
    <button id="spinBtn">Girar 🎰</button>

    <div id="result" style="margin:10px 0;"></div>

    <div id="adminPanel" style="display:none; margin-top:20px;">
      <h3>Panel Admin</h3>

      <input id="newUser" placeholder="Nuevo usuario" />
      <input id="newPass" type="password" placeholder="Contraseña" />
      <button id="createUserBtn">Crear usuario</button>

      <br/><br/>

      <input id="chipUser" placeholder="Usuario" />
      <input id="chipAmount" type="number" placeholder="Fichas" />
      <button id="setChipsBtn">Cargar fichas</button>
    </div>
  </div>

  <script src="app.js" defer></script>

</body>
</html>
